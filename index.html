<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositories</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="repo-section">
    <h2>GitHub Repositories</h2>
    <ul id="github-repos" class="repo-list"></ul>

    <h3>Other GitHub Projects</h3>
    <ul class="repo-list">
      <li><a href="https://github.com/Sjoblompwr/ProjektOOP2" target="_blank">ProjektOOP2</a></li>
    </ul>

    <h2>GitLab Repositories</h2>
    <ul id="gitlab-repos" class="repo-list"></ul>

    <h3>Other GitLab Projects</h3>
    <ul class="repo-list">
      <li><a href="https://gitlab.com/albinjerkers/advwebbprojekt" target="_blank">advwebbprojekt</a></li>
      <li><a href="https://gitlab.com/christofferjansson/projektarbete-programvaruteknik" target="_blank">projektarbete-programvaruteknik</a></li>
      <li><a href="https://gitlab.com/firetyler110/workspace" target="_blank">workspace</a></li>
    </ul>
  </div>

  <script>
    const githubUser = "firetyler";
    const gitlabUser = "firetyler110";

    // Fetch GitHub repos
    fetch(`https://api.github.com/users/${githubUser}/repos?sort=updated`)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("github-repos");
        list.innerHTML = "";
        data.forEach(repo => {
          const item = document.createElement("li");
          item.innerHTML = `<a href="${repo.html_url}" target="_blank">${repo.name}</a>`;
          list.appendChild(item);
        });
      });

    // Fetch GitLab repos
    fetch(`https://gitlab.com/api/v4/users?username=${gitlabUser}`)
      .then(res => res.json())
      .then(user => fetch(`https://gitlab.com/api/v4/users/${user[0].id}/projects?order_by=last_activity_at`))
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("gitlab-repos");
        list.innerHTML = "";
        data.forEach(repo => {
          const item = document.createElement("li");
          item.innerHTML = `<a href="${repo.web_url}" target="_blank">${repo.name}</a>`;
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
